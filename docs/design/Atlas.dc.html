<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sound atlas</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&amp;family=IBM+Plex+Sans+Condensed:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#9AA3B2}a:hover{color:#E8EAED}
</style>
</helmet>
<div style="width: 480px; height: 480px; box-sizing: border-box; display: flex; flex-direction: column; background: #0B0D11; color: #E8EAED; font-family: 'IBM Plex Sans Condensed', 'Arial Narrow', sans-serif; overflow: hidden">
<header style="height: 40px; flex: none; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; background: #11151C; border-bottom: 1px solid #2A3242">
<div style="display: flex; align-items: center; gap: 8px">
<span style="background: #E8EAED; color: #0B0D11; font-weight: 700; font-size: 16px; padding: 2px 8px; border-radius: 6px; letter-spacing: 0.04em">ATLAS</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 16px; font-weight: 600">ALL ENGINES</span>
</div>
<div style="display: flex; align-items: center; gap: 6px; font-family: 'IBM Plex Mono', monospace">
<svg width="12" height="14" viewBox="0 0 14 16" role="img" aria-label="Playing"><path d="M1 1 L13 8 L1 15 Z" fill="#7EE08A"></path></svg>
<span style="font-size: 16px; font-weight: 600">120</span>
</div>
<svg width="28" height="14" viewBox="0 0 30 16" role="img" aria-label="Battery about three quarters full"><rect x="1" y="1" width="25" height="14" rx="3" fill="none" stroke="#9AA3B2" stroke-width="2"></rect><rect x="27" y="5" width="2" height="6" rx="1" fill="#9AA3B2"></rect><rect x="4" y="4" width="15" height="8" rx="1.5" fill="#E8EAED"></rect></svg>
</header>

<span style="position: absolute; left: 0; right: 0; bottom: 4px; text-align: center; font-size: 16px; color: #9AA3B2; letter-spacing: 0.08em">▼ SOFT</span>

<div style="position: absolute; left: 270px; top: 226px; width: 168px; box-sizing: border-box; padding: 8px 10px; border-radius: 10px; background: #1C2230; border: 2px solid #FFB454; display: flex; align-items: center; gap: 8px">
<svg width="40" height="40" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="46" fill="none" stroke="#2A3242" stroke-width="3"></circle><polygon points="50,7.4 70.5,29.5 85.8,50 65.7,65.7 50,89.2 31.9,68.1 17.6,50 36.7,36.7" fill="#FFB454" fill-opacity="0.22" stroke="#FFB454" stroke-width="5" stroke-linejoin="round"></polygon><circle cx="50" cy="50" r="6" fill="#FFB454"></circle></svg>
<div style="display: flex; flex-direction: column; line-height: 1.15">
<span style="font-size: 16px; font-weight: 700">WARM BRASS</span>
<span style="font-size: 16px; color: #9AA3B2">VA · 3 NEAR</span>
</div>
</div>
</div>
<div style="display: flex; justify-content: space-between; font-size: 16px; color: #9AA3B2; letter-spacing: 0.08em">
<span>◀ DARK</span>
<span>BRIGHT ▶</span>
</div>
</main>
<footer style="height: 52px; flex: none; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: #2A3242; border-top: 1px solid #2A3242">
<div style="display: flex; align-items: center; gap: 6px; padding: 0 8px; background: #11151C">
<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="#2A3242" stroke-width="3"></circle><circle cx="12" cy="12" r="9" fill="none" stroke="#E8EAED" stroke-width="3" stroke-linecap="round" stroke-dasharray="25.5 56.6" transform="rotate(-90 12 12)"></circle></svg>
<div style="display: flex; flex-direction: column; line-height: 1.1">
<span style="font-size: 16px; color: #9AA3B2">K1 TONE</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 16px; font-weight: 600">45%</span>
</div>
</div>
<div style="display: flex; align-items: center; gap: 6px; padding: 0 8px; background: #11151C">
<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="#2A3242" stroke-width="3"></circle><circle cx="12" cy="12" r="9" fill="none" stroke="#E8EAED" stroke-width="3" stroke-linecap="round" stroke-dasharray="34.0 56.6" transform="rotate(-90 12 12)"></circle></svg>
<div style="display: flex; flex-direction: column; line-height: 1.1">
<span style="font-size: 16px; color: #9AA3B2">K2 ATTACK</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 16px; font-weight: 600">60%</span>
</div>
</div>
<div style="display: flex; align-items: center; gap: 6px; padding: 0 8px; background: #11151C">
<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="#2A3242" stroke-width="3"></circle><circle cx="12" cy="12" r="9" fill="none" stroke="#E8EAED" stroke-width="3" stroke-linecap="round" stroke-dasharray="11.3 56.6" transform="rotate(-90 12 12)"></circle></svg>
<div style="display: flex; flex-direction: column; line-height: 1.1">
<span style="font-size: 16px; color: #9AA3B2">K3 ZOOM</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 16px; font-weight: 600">1×</span>
</div>
</div>
<div style="display: flex; align-items: center; gap: 6px; padding: 0 8px; background: #11151C">
<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="#2A3242" stroke-width="3"></circle><circle cx="12" cy="12" r="9" fill="none" stroke="#E8EAED" stroke-width="3" stroke-linecap="round" stroke-dasharray="56.6 56.6" transform="rotate(-90 12 12)"></circle></svg>
<div style="display: flex; flex-direction: column; line-height: 1.1">
<span style="font-size: 16px; color: #9AA3B2">K4 PLAY</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 16px; font-weight: 600">AUTO</span>
</div>
</div>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"ground":{"editor":"color","default":"#0B0D11"},"$preview":{"width":480,"height":480}}'>
class Component extends DCLogic {
renderVals() {
return { ground: this.props.ground ?? '#0B0D11' };
}
}
</script>
</body>
</html>
