<!-- Doubling the loop (decided 29.10.2026, from Fabio's STEP note E): HOME + SEQ on the looper's page (LOOP or
     STEP) makes the loop twice as long and copies every part's notes into the new bars: 1 -> 2 -> 4 -> 8 -> 16 bars.
     The header says DOUBLE and the new length for a moment. Nothing changes with no loop yet, while a take or a
     count-in runs, past 16 bars (MAX 16 BARS), or when a part has no room for its copy (FULL: no part doubled).
     K2 LENGTH stays as it is (new bars empty). HOME + OCT- halves the loop (HALF 8 BARS; 16 -> 8 -> 4 -> 2 -> 1,
     odd lengths rounded up): the bars after are hidden as with K2 LENGTH, so a DOUBLE too many is undone. Here: 2 bars doubled to 4, part 2 DRUMS chosen, the loop plays -->
