<!-- v0.6's mixer, tab SEND (beside MIX, v0.5's knobs). GLO opens the mixer on MIX; GLO or OCT+ goes to the
     other tab (as SEQ on the looper's page and EDIT on the edit pages), OCT- back to the rack. Both tabs draw the
     same strips: LEVEL, PAN, the sends DLY and HALL (bars), MUTE, SOLO; the chosen part's strip is framed (SEL or
     SELECT the next), and the tab colours what its knobs turn (MIX: the faders, SEND: the send bars, every part's;
     the chosen part's labels lit).
     SEND: K1 DELAY and K2 HALL send the chosen part to the effects (0 .. 100, squared: 50 is -12 dB; after LEVEL,
     MUTE and SOLO, before PAN: the effects take the parts mono). K3 and K4 stay free (later the sends to a chorus or a drive). HOME + K1 or K2: back to 0 (off),
     marked at the bar's start while the knob is elsewhere.
     MASTER: the MASTER pot, the output's peak L and R, LIM; DLY and HALL show the effects' returns (LEVEL on the FX
     page), as they come back into the master before the limiter.
