<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sequencer grid</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&amp;family=IBM+Plex+Sans+Condensed:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#9AA3B2}a:hover{color:#E8EAED}
</style>
</helmet>
<div style="width: 480px; height: 480px; box-sizing: border-box; display: flex; flex-direction: column; background: #0B0D11; color: #E8EAED; font-family: 'IBM Plex Sans Condensed', 'Arial Narrow', sans-serif; overflow: hidden">
<header style="height: 40px; flex: none; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; background: #11151C; border-bottom: 1px solid #2A3242">
<div style="display: flex; align-items: center; gap: 8px; min-width: 0">
<span style="background: #E8EAED; color: #0B0D11; font-weight: 700; font-size: 16px; padding: 2px 8px; border-radius: 6px; letter-spacing: 0.04em; flex: none">SEQ</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 16px; font-weight: 600; white-space: nowrap">PATTERN A01</span>
</div>
<div style="display: flex; align-items: center; gap: 8px; flex: none">
<svg width="12" height="14" viewBox="0 0 14 16" role="img" aria-label="Playing"><path d="M1 1 L13 8 L1 15 Z" fill="#7EE08A"></path></svg>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 16px; font-weight: 600">120</span>
<svg width="28" height="14" viewBox="0 0 30 16" role="img" aria-label="Battery about three quarters full"><rect x="1" y="1" width="25" height="14" rx="3" fill="none" stroke="#9AA3B2" stroke-width="2"></rect><rect x="27" y="5" width="2" height="6" rx="1" fill="#9AA3B2"></rect><rect x="4" y="4" width="15" height="8" rx="1.5" fill="#E8EAED"></rect></svg>
</div>

<span style="display: flex; align-items: center; color: #9AA3B2">STEP</span>
<span style="display: flex; align-items: center; color: #9AA3B2">SONG</span>

</nav>
<main style="flex: 1; min-height: 0; box-sizing: border-box; padding: 10px 16px; display: flex; flex-direction: column; gap: 5px">

<div style="display: flex; align-items: center; gap: 6px; height: 32px; flex: none"><span style="width: 70px; flex: none; display: flex; align-items: center; gap: 6px; font-size: 16px; font-weight: 700"><svg width="20" height="20" viewBox="0 0 100 100" aria-hidden="true" style="flex: none"><polygon points="50,4 60.9,39.1 89.2,50 60.9,60.9 50,82.4 39.1,60.9 7.4,50 39.1,39.1" fill="#E3F45E" fill-opacity="0.22" stroke="#E3F45E" stroke-width="8" stroke-linejoin="round"></polygon></svg>ACID</span><div style="flex: 1; height: 100%; display: grid; grid-template-columns: repeat(16, minmax(0, 1fr)); gap: 2px"><div style="border-radius: 3px; background: #E3F45E"></div><div style="border-radius: 3px; background: #E3F45E"></div><div style="border-radius: 3px; background: #1C2230"></div><div style="border-radius: 3px; background: #E3F45E"></div><div style="border-radius: 3px; background: #262E3E"></div><div style="border-radius: 3px; background: #E3F45E"></div><div style="border-radius: 3px; background: #E3F45E"></div><div style="border-radius: 3px; background: #1C2230"></div><div style="border-radius: 3px; background: #E3F45E; outline: 2px solid #E8EAED; outline-offset: 1px"></div><div style="border-radius: 3px; background: #1C2230"></div><div style="border-radius: 3px; background: #E3F45E"></div><div style="border-radius: 3px; background: #E3F45E"></div><div style="border-radius: 3px; background: #262E3E"></div><div style="border-radius: 3px; background: #E3F45E"></div><div style="border-radius: 3px; background: #1C2230"></div><div style="border-radius: 3px; background: #E3F45E"></div></div></div>
<div style="display: flex; align-items: center; gap: 6px; height: 32px; flex: none"><span style="width: 70px; flex: none; display: flex; align-items: center; gap: 6px; font-size: 16px; font-weight: 700"><svg width="20" height="20" viewBox="0 0 100 100" aria-hidden="true" style="flex: none"><polygon points="50,27.8 81.3,18.7 68.8,50 80.1,80.1 50,70.5 21.1,78.9 27.8,50 19.9,19.9" fill="#5CC8FF" fill-opacity="0.22" stroke="#5CC8FF" stroke-width="8" stroke-linejoin="round"></polygon></svg>FM6</span><div style="flex: 1; height: 100%; display: grid; grid-template-columns: repeat(16, minmax(0, 1fr)); gap: 2px"><div style="border-radius: 3px; background: #262E3E"></div><div style="border-radius: 3px; background: #1C2230"></div><div style="border-radius: 3px; background: #1C2230"></div><div style="border-radius: 3px; background: #1C2230"></div><div style="border-radius: 3px; background: #5CC8FF"></div><div style="border-radius: 3px; background: #1C2230"></div><div style="border-radius: 3px; background: #1C2230"></div><div style="border-radius: 3px; background: #1C2230"></div><div style="border-radius: 3px; background: #262E3E"></div><div style="border-radius: 3px; background: #1C2230"></div><div style="border-radius: 3px; background: #1C2230"></div><div style="border-radius: 3px; background: #1C2230"></div><div style="border-radius: 3px; background: #5CC8FF"></div><div style="border-radius: 3px; background: #1C2230"></div><div style="border-radius: 3px; background: #1C2230"></div><div style="border-radius: 3px; background: #1C2230"></div></div></div>
<div style="display: flex; align-items: center; gap: 6px; height: 32px; flex: none"><span style="width: 70px; flex: none; display: flex; align-items: center; gap: 6px; font-size: 16px; font-weight: 700"><svg width="20" height="20" viewBox="0 0 100 100" aria-hidden="true" style="flex: none"><polygon points="50,7.4 80.1,19.9 75.6,50 68.1,68.1 50,92.6 19.9,80.1 24.4,50 31.9,31.9" fill="#7EE08A" fill-opacity="0.22" stroke="#7EE08A" stroke-width="8" stroke-linejoin="round"></polygon></svg>ORG</span><div style="flex: 1; height: 100%; display: grid; grid-template-columns: repeat(16, minmax(0, 1fr)); gap: 2px"><div style="border-radius: 3px; background: #7EE08A"></div><div style="border-radius: 3px; background: #3F7048"></div><div style="border-radius: 3px; background: #3F7048"></div><div style="border-radius: 3px; background: #3F7048"></div><div style="border-radius: 3px; background: #262E3E"></div><div style="border-radius: 3px; background: #1C2230"></div><div style="border-radius: 3px; background: #1C2230"></div><div style="border-radius: 3px; background: #1C2230"></div><div style="border-radius: 3px; background: #7EE08A"></div><div style="border-radius: 3px; background: #3F7048"></div><div style="border-radius: 3px; background: #3F7048"></div><div style="border-radius: 3px; background: #3F7048"></div><div style="border-radius: 3px; background: #262E3E"></div><div style="border-radius: 3px; background: #1C2230"></div><div style="border-radius: 3px; background: #1C2230"></div><div style="border-radius: 3px; background: #1C2230"></div></div></div>
<section style="box-sizing: border-box; border-radius: 12px; background: #151922; margin-top: 5px; flex: 1; min-height: 0; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; align-items: center"><span style="font-size: 16px; font-weight: 700; letter-spacing: 0.08em; color: #E3F45E">STEP 09 · ACID</span><span style="font-size: 16px; color: #9AA3B2">PART 2</span></div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px 12px"><div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; color: #9AA3B2">NOTE</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 18px; font-weight: 600">C2</span></div><div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; color: #9AA3B2">VEL</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 18px; font-weight: 600">96</span></div><div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; color: #9AA3B2">LEN</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 18px; font-weight: 600">1/16</span></div><div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; color: #9AA3B2">CHANCE</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 18px; font-weight: 600">100%</span></div><div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; color: #9AA3B2">RATCH</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 18px; font-weight: 600">×1</span></div><div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; color: #9AA3B2">SLIDE</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 18px; font-weight: 600; color: #E3F45E">ON</span></div></div>
</section>
</main>
<footer style="height: 52px; flex: none; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: #2A3242; border-top: 1px solid #2A3242">
<div style="display: flex; align-items: center; gap: 6px; padding: 0 8px; background: #11151C; min-width: 0">
<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="flex: none"><circle cx="12" cy="12" r="9" fill="none" stroke="#2A3242" stroke-width="3"></circle><circle cx="12" cy="12" r="9" fill="none" stroke="#E3F45E" stroke-width="3" stroke-linecap="round" stroke-dasharray="31.7 56.6" transform="rotate(-90 12 12)"></circle></svg>
<div style="display: flex; flex-direction: column; line-height: 1.1; min-width: 0">
<span style="font-size: 16px; color: #9AA3B2; white-space: nowrap">K1 STEP</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 16px; font-weight: 600; white-space: nowrap">09</span>
</div>
</div>
<div style="display: flex; align-items: center; gap: 6px; padding: 0 8px; background: #11151C; min-width: 0">
<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="flex: none"><circle cx="12" cy="12" r="9" fill="none" stroke="#2A3242" stroke-width="3"></circle><circle cx="12" cy="12" r="9" fill="none" stroke="#E3F45E" stroke-width="3" stroke-linecap="round" stroke-dasharray="15.8 56.6" transform="rotate(-90 12 12)"></circle></svg>
<div style="display: flex; flex-direction: column; line-height: 1.1; min-width: 0">
<span style="font-size: 16px; color: #9AA3B2; white-space: nowrap">K2 NOTE</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 16px; font-weight: 600; white-space: nowrap">C2</span>
</div>
</div>
<div style="display: flex; align-items: center; gap: 6px; padding: 0 8px; background: #11151C; min-width: 0">
<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="flex: none"><circle cx="12" cy="12" r="9" fill="none" stroke="#2A3242" stroke-width="3"></circle><circle cx="12" cy="12" r="9" fill="none" stroke="#E3F45E" stroke-width="3" stroke-linecap="round" stroke-dasharray="43.0 56.6" transform="rotate(-90 12 12)"></circle></svg>
<div style="display: flex; flex-direction: column; line-height: 1.1; min-width: 0">
<span style="font-size: 16px; color: #9AA3B2; white-space: nowrap">K3 VEL</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 16px; font-weight: 600; white-space: nowrap">96</span>
</div>
</div>
<div style="display: flex; align-items: center; gap: 6px; padding: 0 8px; background: #11151C; min-width: 0">
<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="flex: none"><circle cx="12" cy="12" r="9" fill="none" stroke="#2A3242" stroke-width="3"></circle><circle cx="12" cy="12" r="9" fill="none" stroke="#E3F45E" stroke-width="3" stroke-linecap="round" stroke-dasharray="3.4 56.6" transform="rotate(-90 12 12)"></circle></svg>
<div style="display: flex; flex-direction: column; line-height: 1.1; min-width: 0">
<span style="font-size: 16px; color: #9AA3B2; white-space: nowrap">K4 LENGTH</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 16px; font-weight: 600; white-space: nowrap">1/16</span>
</div>
</div>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"ground":{"editor":"color","default":"#0B0D11"},"$preview":{"width":480,"height":480}}'>

}
}
</script>
</body>
</html>
