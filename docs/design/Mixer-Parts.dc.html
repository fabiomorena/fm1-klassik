<!-- v0.5's mixer (the target with sends and pages is Mixer.dc.html, with the effects in v0.6). GLO opens and closes
     it, OCT- goes back too. The strip of the chosen part is framed (SEL goes to the next); K1 LEVEL (-40 .. +6 dB,
     below -40 off), K2 PAN (L50 .. C .. R50), K3 MUTE, K4 SOLO are its. A muted part, or every part but the soloed
     ones, is drawn dim. MASTER: the MASTER pot, the output's peak for L and R, LIM lit while the limiter holds the
     level down. HOME held and K1..K4 turned: back to 0 dB, the middle, off. Here: part 3 chosen and soloed, part 4
