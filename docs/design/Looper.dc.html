<!-- v0.5's note looper. SEQ opens and closes it, OCT- goes back too; the keys play on. It records notes, not
     sound: what the keys and MIDI play into the chosen part. All four parts share one loop (its length and tempo).
     A lane a part: its notes over the loop (higher up = higher; DRUMS a row an instrument), the bar lines, the play
     position (the white line); the chosen part's lane is framed, REC on it while it records, EMPTY with no notes.
     The header says what the looper does (REC 2 DRUMS, PLAY, STOP, COUNT-IN, EMPTY); on the right, on every screen:
     a red dot recording (a green triangle playing, nothing stopped), bar and beat.
     PLAY starts and stops the loop on every screen (its LED green; red while recording). REC records into the
     chosen part, on top of what it has (overdub), until REC again; SEL or SELECT takes the recording to the next
     part. Stopped, REC counts one bar in with the click first (CLICK OFF: none). The first take (all lanes empty,
     LENGTH AUTO) sets the loop's length: REC again ends it, rounded to whole bars, and the loop plays on (PLAY ends it
     and stops). PLAY on an empty loop with LENGTH AUTO: EMPTY, REC FIRST.
     HOME + REC: the last take is taken back, whichever part made it, the message names it (again: it is back; one
     step). HOME + PLAY: the chosen part emptied (asks first: OCT+ yes, OCT- no; HOME + REC brings it back).
     K1 TEMPO 40 .. 240 BPM. K2 LENGTH AUTO or 1 .. 16 bars (shorter hides the bars after, longer adds empty ones;
     AUTO only while empty). K3 QUANT OFF, 1/32, 1/16, 1/8, 1/4 (where recorded notes start). K4 CLICK OFF, REC
     (count-in and while recording), ON. HOME + K1..K4: 120 BPM, the first take's length, 1/16, REC, marked on the
     bar while the knob is elsewhere.
     Here: a 4-bar loop at 98 BPM (marked: 120), at bar 3 beat 2; part 2 DRUMS records hats over its kick and snare,
     part 4 has nothing yet -->
