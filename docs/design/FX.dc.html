<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FX chain</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&amp;family=IBM+Plex+Sans+Condensed:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#9AA3B2}a:hover{color:#E8EAED}
</style>
</helmet>
<div style="width: 480px; height: 480px; box-sizing: border-box; display: flex; flex-direction: column; background: #0B0D11; color: #E8EAED; font-family: 'IBM Plex Sans Condensed', 'Arial Narrow', sans-serif; overflow: hidden">
<header style="height: 40px; flex: none; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; background: #11151C; border-bottom: 1px solid #2A3242">
<div style="display: flex; align-items: center; gap: 8px; min-width: 0">
<span style="background: #E8EAED; color: #0B0D11; font-weight: 700; font-size: 16px; padding: 2px 8px; border-radius: 6px; letter-spacing: 0.04em; flex: none">FX</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 16px; font-weight: 600; white-space: nowrap">MASTER</span>
</div>
<div style="display: flex; align-items: center; gap: 8px; flex: none">
<svg width="12" height="14" viewBox="0 0 14 16" role="img" aria-label="Playing"><path d="M1 1 L13 8 L1 15 Z" fill="#7EE08A"></path></svg>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 16px; font-weight: 600">120</span>
<svg width="28" height="14" viewBox="0 0 30 16" role="img" aria-label="Battery about three quarters full"><rect x="1" y="1" width="25" height="14" rx="3" fill="none" stroke="#9AA3B2" stroke-width="2"></rect><rect x="27" y="5" width="2" height="6" rx="1" fill="#9AA3B2"></rect><rect x="4" y="4" width="15" height="8" rx="1.5" fill="#E8EAED"></rect></svg>
</div>
</header>
<nav style="height: 32px; flex: none; box-sizing: border-box; padding: 0 16px; display: flex; align-items: stretch; gap: 14px; border-bottom: 1px solid #2A3242; font-size: 16px; letter-spacing: 0.06em">
<span style="display: flex; align-items: center; color: #E8EAED; font-weight: 700; border-bottom: 3px solid #E8EAED">CHAIN</span>
<span style="display: flex; align-items: center; color: #9AA3B2">DRIVE</span>
<span style="display: flex; align-items: center; color: #9AA3B2">CHORUS</span>
<span style="display: flex; align-items: center; color: #9AA3B2">DELAY</span>
<span style="display: flex; align-items: center; color: #9AA3B2">REVERB</span>
<span style="margin-left: auto; display: flex; align-items: center; font-family: 'IBM Plex Mono', monospace; color: #9AA3B2">1/5</span>
</nav>
<main style="flex: 1; min-height: 0; box-sizing: border-box; padding: 10px 16px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; flex: none">
<div style="flex: 1; min-width: 0; height: 70px; box-sizing: border-box; border-radius: 10px; background: #151922; border: 2px solid #2A3242; padding: 8px; display: flex; flex-direction: column; justify-content: space-between"><div style="display: flex; justify-content: space-between; align-items: center"><span style="font-size: 16px; font-weight: 700; color: #9AA3B2">DRIVE</span><span style="width: 12px; height: 12px; box-sizing: border-box; border-radius: 6px; border: 2px solid #9AA3B2; flex: none"></span></div><span style="font-family: 'IBM Plex Mono', monospace; font-size: 16px; white-space: nowrap; color: #9AA3B2">OFF</span></div><div style="width: 8px; height: 3px; flex: none; background: #9AA3B2"></div><div style="flex: 1; min-width: 0; height: 70px; box-sizing: border-box; border-radius: 10px; background: #151922; border: 2px solid #2A3242; padding: 8px; display: flex; flex-direction: column; justify-content: space-between"><div style="display: flex; justify-content: space-between; align-items: center"><span style="font-size: 16px; font-weight: 700">CHORUS</span><span style="width: 12px; height: 12px; border-radius: 6px; background: #E8EAED; flex: none"></span></div><span style="font-family: 'IBM Plex Mono', monospace; font-size: 16px; white-space: nowrap; color: #9AA3B2">0.6 Hz</span></div><div style="width: 8px; height: 3px; flex: none; background: #9AA3B2"></div><div style="flex: 1; min-width: 0; height: 70px; box-sizing: border-box; border-radius: 10px; background: #262E3E; border: 2px solid #E8EAED; padding: 8px; display: flex; flex-direction: column; justify-content: space-between"><div style="display: flex; justify-content: space-between; align-items: center"><span style="font-size: 16px; font-weight: 700">DELAY</span><span style="width: 12px; height: 12px; border-radius: 6px; background: #E8EAED; flex: none"></span></div><span style="font-family: 'IBM Plex Mono', monospace; font-size: 16px; white-space: nowrap">3/16·65%</span></div><div style="width: 8px; height: 3px; flex: none; background: #9AA3B2"></div><div style="flex: 1; min-width: 0; height: 70px; box-sizing: border-box; border-radius: 10px; background: #151922; border: 2px solid #2A3242; padding: 8px; display: flex; flex-direction: column; justify-content: space-between"><div style="display: flex; justify-content: space-between; align-items: center"><span style="font-size: 16px; font-weight: 700">REVERB</span><span style="width: 12px; height: 12px; border-radius: 6px; background: #E8EAED; flex: none"></span></div><span style="font-family: 'IBM Plex Mono', monospace; font-size: 16px; white-space: nowrap; color: #9AA3B2">2.4 s</span></div>
</div>
<section style="box-sizing: border-box; border-radius: 12px; background: #151922; flex: 1; min-height: 0; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; align-items: center"><span style="font-size: 16px; font-weight: 700; letter-spacing: 0.08em">DELAY · SYNC</span><span style="font-size: 16px; color: #9AA3B2">PING-PONG</span></div>
<svg width="424" height="130" viewBox="0 0 424 130" role="img" aria-label="Delay echoes alternating left and right, each quieter than the last">
<path d="M20 65 H424" stroke="#2A3242" stroke-width="1" fill="none"></path>
<text x="0" y="28" font-family="IBM Plex Mono, monospace" font-size="16" fill="#9AA3B2">L</text>
<text x="0" y="114" font-family="IBM Plex Mono, monospace" font-size="16" fill="#9AA3B2">R</text>
<rect x="24" y="15" width="8" height="100" rx="2" fill="#9AA3B2"></rect>
<rect x="88" y="35.1" width="8" height="29.9" rx="2" fill="#E8EAED"></rect><rect x="152" y="65" width="8" height="19.4" rx="2" fill="#E8EAED"></rect><rect x="216" y="52.4" width="8" height="12.6" rx="2" fill="#E8EAED"></rect><rect x="280" y="65" width="8" height="8.2" rx="2" fill="#E8EAED"></rect><rect x="344" y="59.7" width="8" height="5.3" rx="2" fill="#E8EAED"></rect><rect x="408" y="65" width="8" height="3.5" rx="2" fill="#E8EAED"></rect>
</svg>
<span style="margin-top: auto; font-family: 'IBM Plex Mono', monospace; font-size: 16px; color: #9AA3B2">SYNC 120 BPM · 3/16 = 375 ms</span>
</section>
</main>
<footer style="height: 52px; flex: none; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: #2A3242; border-top: 1px solid #2A3242">
<div style="display: flex; align-items: center; gap: 6px; padding: 0 8px; background: #11151C; min-width: 0">
<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="flex: none"><circle cx="12" cy="12" r="9" fill="none" stroke="#2A3242" stroke-width="3"></circle><circle cx="12" cy="12" r="9" fill="none" stroke="#E8EAED" stroke-width="3" stroke-linecap="round" stroke-dasharray="22.6 56.6" transform="rotate(-90 12 12)"></circle></svg>
<div style="display: flex; flex-direction: column; line-height: 1.1; min-width: 0">
<span style="font-size: 16px; color: #9AA3B2; white-space: nowrap">K1 TIME</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 16px; font-weight: 600; white-space: nowrap">3/16</span>
</div>
</div>
<div style="display: flex; align-items: center; gap: 6px; padding: 0 8px; background: #11151C; min-width: 0">
<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="flex: none"><circle cx="12" cy="12" r="9" fill="none" stroke="#2A3242" stroke-width="3"></circle><circle cx="12" cy="12" r="9" fill="none" stroke="#E8EAED" stroke-width="3" stroke-linecap="round" stroke-dasharray="36.8 56.6" transform="rotate(-90 12 12)"></circle></svg>
<div style="display: flex; flex-direction: column; line-height: 1.1; min-width: 0">
<span style="font-size: 16px; color: #9AA3B2; white-space: nowrap">K2 FDBK</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 16px; font-weight: 600; white-space: nowrap">65%</span>
</div>
</div>
<div style="display: flex; align-items: center; gap: 6px; padding: 0 8px; background: #11151C; min-width: 0">
<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="flex: none"><circle cx="12" cy="12" r="9" fill="none" stroke="#2A3242" stroke-width="3"></circle><circle cx="12" cy="12" r="9" fill="none" stroke="#E8EAED" stroke-width="3" stroke-linecap="round" stroke-dasharray="17.0 56.6" transform="rotate(-90 12 12)"></circle></svg>
<div style="display: flex; flex-direction: column; line-height: 1.1; min-width: 0">
<span style="font-size: 16px; color: #9AA3B2; white-space: nowrap">K3 MIX</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 16px; font-weight: 600; white-space: nowrap">30%</span>
</div>
</div>
<div style="display: flex; align-items: center; gap: 6px; padding: 0 8px; background: #11151C; min-width: 0">
<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="flex: none"><circle cx="12" cy="12" r="9" fill="none" stroke="#2A3242" stroke-width="3"></circle><circle cx="12" cy="12" r="9" fill="none" stroke="#E8EAED" stroke-width="3" stroke-linecap="round" stroke-dasharray="34.0 56.6" transform="rotate(-90 12 12)"></circle></svg>
<div style="display: flex; flex-direction: column; line-height: 1.1; min-width: 0">
<span style="font-size: 16px; color: #9AA3B2; white-space: nowrap">K4 TONE</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 16px; font-weight: 600; white-space: nowrap">60%</span>
</div>
</div>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"ground":{"editor":"color","default":"#0B0D11"},"$preview":{"width":480,"height":480}}'>
class Component extends DCLogic {
renderVals() {
return { ground: this.props.ground ?? '#0B0D11' };
}
}
</script>
</body>
</html>
