<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sound glyph browser</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&amp;family=IBM+Plex+Sans+Condensed:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#9AA3B2}a:hover{color:#E8EAED}
</style>
</helmet>

<span style="font-size: 16px; font-weight: 700">JAZZ ORGAN</span>
<span style="font-size: 16px; color: #9AA3B2">ORGAN</span>

<div style="display: flex; align-items: center; gap: 6px; padding: 0 8px; background: #11151C">
<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="#2A3242" stroke-width="3"></circle><circle cx="12" cy="12" r="9" fill="none" stroke="#FFB454" stroke-width="3" stroke-linecap="round" stroke-dasharray="28.3 56.6" transform="rotate(-90 12 12)"></circle></svg>
<div style="display: flex; flex-direction: column; line-height: 1.1">
<span style="font-size: 16px; color: #9AA3B2">K1 MOVE</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 16px; font-weight: 600">5/9</span>
</div>
</div>
<div style="display: flex; align-items: center; gap: 6px; padding: 0 8px; background: #11151C">

<div style="display: flex; flex-direction: column; line-height: 1.1">

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"ground":{"editor":"color","default":"#0B0D11"},"$preview":{"width":480,"height":480}}'>
class Component extends DCLogic {
renderVals() {
return { ground: this.props.ground ?? '#0B0D11' };
}
}
</script>
</body>
</html>
