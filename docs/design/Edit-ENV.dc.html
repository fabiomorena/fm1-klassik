<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&amp;family=IBM+Plex+Sans+Condensed:wght@400;600;700&amp;display=swap" rel="stylesheet">

<!-- v0.8 (proposed 29.10.2026): the envelope (ADSR) is the sound's (its preset's, the USER sound's): the last tab of the edit pages (VA OSC, FLT, ENV, MORE; PD PHS, LINE, ENV, MORE; ORGAN BARS, TONE, ENV, MORE; FM6 ALGO, ENV). ENV opens the chosen part's edit pages on it (EDIT on the first tab); EDIT or OCT+ the next tab, OCT- back. ACID: ENV stays its accent; DRUMS: NO ENV. K1 ATK, K2 DEC, K3 SUS, K4 REL, ATK/DEC/REL shown as times; HOME + K1..K4: the sound's values, marked on the bar while elsewhere. The picture: the curve as it plays (decay and release curved), a dot where the latest note is; below ENV > FILTER (set on MORE, mockup 34b; VA: to the cutoff, PD: to DCW; ORGAN and FM6 none) and the live glyph. Here part 1 VA SAW LEAD (ATK 4, DEC 70, SUS 100, REL 50 of 127; times are examples). -->
<div style="width: 480px; height: 480px; box-sizing: border-box; display: flex; flex-direction: column; background: #0B0D11; color: #E8EAED; font-family: 'IBM Plex Sans Condensed', 'Arial Narrow', sans-serif; overflow: hidden">
<header style="height: 40px; flex: none; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; background: #11151C; border-bottom: 1px solid #2A3242">
