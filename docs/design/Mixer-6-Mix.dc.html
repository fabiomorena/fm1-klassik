<!-- Decided and implemented, 28a (29.10.2026, from Fabio's MIXER note A1): tab MIX without the sends. The DLY

     an effect added later needs no room here. Fabio, 29.10.: the faders bolder (5 px, the handle 7 x 22 px with round
     corners, as the FM-1's keys; meters 6 px, PAN's line 3 px). The sends live on the tab SEND only (28b), the returns on the FX page
