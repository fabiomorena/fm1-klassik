<!--     v0.6's step sequencer: the looper's page has two tabs, LOOP and STEP (SEQ or OCT+ the other, as EDIT and OCT+
     on the edit pages; OCT- back to the rack). STEP shows one bar of the loop (K1 BAR) as 16 steps of 1/16 for each part; a step is set where
     the part has a note starting within it (played in or set here: the same notes as the looper's). The play
     position runs over the columns (the step number lit).
     The 16 white keys are the chosen part's 16 steps (F3 = step 1 .. G5 = step 16): an empty step is set as its key
     goes down (K2 NOTE, K3 VEL, K4 LEN), a set one cleared as its key comes up (unless a knob was turned meanwhile);
     their lights show the steps set, a running light the step playing. A key held and K2..K4 turned: that step's
     note, velocity, length (framed in white). The black keys do nothing here. HOME + K2..K4: back to C in the part's
     octave (DRUMS: BD), 100, 1/16 (marked on the bar). The loop empty (LENGTH AUTO): the first step sets 1 bar.
     Here: a 2-bar loop playing at bar 1 step 6; part 3 ACID chosen, step 9 held: C2, velocity 96 (marked: 100),
     1/16. A step longer than 1/16 reaching the next note: ACID slides (as when played legato) -->
