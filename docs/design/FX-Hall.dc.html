<!-- v0.6's effects, the FX page, tab HALL (beside DELAY; FX or OCT+ switches, OCT- back to the rack).
     HALL: Mutable Instruments Rings' reverb (MIT, ported to C): four allpasses diffuse the sum of the sends, then two
     loops (two allpasses, a low pass, a delay moved by a slow LFO each) give it out in stereo. Its rooms are fixed
     (no SIZE); what it can turn: the time it rings, the low pass, the diffusion.
     The diagram: the note sent in, the gap of PRE, then the tail, dying away with DECAY, darker with TONE, a little
     different left and right. Below: what each part sends (the mixer's tab SEND).
     K1 PRE 0 .. 100 ms (a delay before the hall: 4 410 samples, 8 820 B). K2 DECAY 0 .. 100 % (Rings' set_time,
     about 0.35 .. 0.98, as Rings maps it). K3 TONE 0 .. 100 % (Rings' set_lp, 100 bright). K4 LEVEL -40 .. +6 dB,
     below off (the return). HOME + K1..K4: 20 ms, 50 %, 60 %, 0 dB, marked while the knob is elsewhere.
     Here: DECAY raised to 70 % (marked: 50 %) -->
