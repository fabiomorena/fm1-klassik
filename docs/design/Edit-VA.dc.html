<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VA POLY – filter page</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&amp;family=IBM+Plex+Sans+Condensed:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#9AA3B2}a:hover{color:#E8EAED}
</style>
</helmet>
<div style="width: 480px; height: 480px; box-sizing: border-box; display: flex; flex-direction: column; background: #0B0D11; color: #E8EAED; font-family: 'IBM Plex Sans Condensed', 'Arial Narrow', sans-serif; overflow: hidden">
<header style="height: 40px; flex: none; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; background: #11151C; border-bottom: 1px solid #2A3242">
<div style="display: flex; align-items: center; gap: 8px; min-width: 0">
<span style="background: #FFB454; color: #0B0D11; font-weight: 700; font-size: 16px; padding: 2px 8px; border-radius: 6px; letter-spacing: 0.04em; flex: none">VA·POLY</span><svg width="22" height="22" viewBox="0 0 100 100" aria-hidden="true" style="flex: none"><polygon points="50,7.4 70.5,29.5 85.8,50 65.7,65.7 50,89.2 31.9,68.1 17.6,50 36.7,36.7" fill="#FFB454" fill-opacity="0.22" stroke="#FFB454" stroke-width="8" stroke-linejoin="round"></polygon></svg>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 16px; font-weight: 600; white-space: nowrap">WARM BRASS</span>
</div>
<div style="display: flex; align-items: center; gap: 8px; flex: none">
<svg width="12" height="14" viewBox="0 0 14 16" role="img" aria-label="Playing"><path d="M1 1 L13 8 L1 15 Z" fill="#7EE08A"></path></svg>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 16px; font-weight: 600">120</span>
<svg width="28" height="14" viewBox="0 0 30 16" role="img" aria-label="Battery about three quarters full"><rect x="1" y="1" width="25" height="14" rx="3" fill="none" stroke="#9AA3B2" stroke-width="2"></rect><rect x="27" y="5" width="2" height="6" rx="1" fill="#9AA3B2"></rect><rect x="4" y="4" width="15" height="8" rx="1.5" fill="#E8EAED"></rect></svg>
</div>
</header>
<nav style="height: 32px; flex: none; box-sizing: border-box; padding: 0 16px; display: flex; align-items: stretch; gap: 14px; border-bottom: 1px solid #2A3242; font-size: 16px; letter-spacing: 0.06em">
<span style="display: flex; align-items: center; color: #9AA3B2">OSC</span>
<span style="display: flex; align-items: center; color: #FFB454; font-weight: 700; border-bottom: 3px solid #FFB454">FILTER</span>
<span style="display: flex; align-items: center; color: #9AA3B2">ENV</span>
<span style="display: flex; align-items: center; color: #9AA3B2">MOD</span>
<span style="display: flex; align-items: center; color: #9AA3B2">FX</span>
<span style="margin-left: auto; display: flex; align-items: center; font-family: 'IBM Plex Mono', monospace; color: #9AA3B2">2/5</span>
</nav>
<main style="flex: 1; min-height: 0; box-sizing: border-box; padding: 10px 16px; display: flex; flex-direction: column; gap: 10px">
<section style="box-sizing: border-box; border-radius: 12px; background: #151922; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; align-items: center">
<span style="font-size: 16px; font-weight: 700; letter-spacing: 0.08em">LOW PASS · 24 dB</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 16px; color: #FFB454">CUT 64%</span>
</div>
<svg width="424" height="128" viewBox="0 0 340 226" preserveAspectRatio="none" role="img" aria-label="Low-pass filter response with a resonance peak at the cutoff">
<path d="M0 56 H340 M0 113 H340 M0 170 H340 M85 0 V226 M170 0 V226 M255 0 V226" stroke="#2A3242" stroke-width="1" fill="none" vector-effect="non-scaling-stroke"></path>
<path d="M0 90 L186 90 C204 90 212 48 222 48 C232 48 238 92 250 132 C272 200 300 218 340 222 L340 226 L0 226 Z" fill="#FFB454" fill-opacity="0.14"></path>
<path d="M0 90 L186 90 C204 90 212 48 222 48 C232 48 238 92 250 132 C272 200 300 218 340 222" fill="none" stroke="#FFB454" stroke-width="3" stroke-linejoin="round" vector-effect="non-scaling-stroke"></path>
<path d="M222 0 V226" stroke="#E8EAED" stroke-width="1.5" stroke-dasharray="4 5" fill="none" vector-effect="non-scaling-stroke"></path>
</svg>
<div style="display: flex; justify-content: space-between; font-family: 'IBM Plex Mono', monospace; font-size: 16px; color: #9AA3B2"><span>20</span><span>200</span><span>2k</span><span>20k Hz</span></div>
</section>
<section style="box-sizing: border-box; border-radius: 12px; background: #151922; padding: 10px 12px; display: flex; align-items: center; gap: 14px">
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 16px; font-weight: 700; letter-spacing: 0.08em">FILTER ENV</span>
<svg width="150" height="70" viewBox="0 0 196 120" preserveAspectRatio="none" role="img" aria-label="Filter envelope: short attack, medium decay, sustain, medium release">
<path d="M0 118 H196" stroke="#2A3242" stroke-width="1" fill="none" vector-effect="non-scaling-stroke"></path>
<path d="M4 116 L30 10 L76 56 L140 56 L192 116 Z" fill="#FFB454" fill-opacity="0.14"></path>
<path d="M4 116 L30 10 L76 56 L140 56 L192 116" fill="none" stroke="#FFB454" stroke-width="3" stroke-linejoin="round" vector-effect="non-scaling-stroke"></path>
</svg>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 12px; font-family: 'IBM Plex Mono', monospace; font-size: 16px">
<span><span style="color: #9AA3B2">A </span>12</span><span><span style="color: #9AA3B2">D </span>40</span>
<span><span style="color: #9AA3B2">S </span>55</span><span><span style="color: #9AA3B2">R </span>30</span>
</div>
<div style="margin-left: auto; display: flex; flex-direction: column; align-items: center; gap: 2px">
<svg width="64" height="64" viewBox="0 0 100 100" role="img" aria-label="Live glyph of Warm Brass" style="flex: none"><circle cx="50" cy="50" r="46" fill="none" stroke="#2A3242" stroke-width="3"></circle><polygon points="50,7.4 70.5,29.5 85.8,50 65.7,65.7 50,89.2 31.9,68.1 17.6,50 36.7,36.7" fill="#FFB454" fill-opacity="0.22" stroke="#FFB454" stroke-width="5" stroke-linejoin="round"></polygon><circle cx="50" cy="50" r="6" fill="#FFB454"></circle></svg>
<span style="font-size: 16px; color: #9AA3B2">LIVE</span>
</div>
</section>
</main>
<footer style="height: 52px; flex: none; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: #2A3242; border-top: 1px solid #2A3242">
<div style="display: flex; align-items: center; gap: 6px; padding: 0 8px; background: #11151C; min-width: 0">
<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="flex: none"><circle cx="12" cy="12" r="9" fill="none" stroke="#2A3242" stroke-width="3"></circle><circle cx="12" cy="12" r="9" fill="none" stroke="#FFB454" stroke-width="3" stroke-linecap="round" stroke-dasharray="36.2 56.6" transform="rotate(-90 12 12)"></circle></svg>
<div style="display: flex; flex-direction: column; line-height: 1.1; min-width: 0">
<span style="font-size: 16px; color: #9AA3B2; white-space: nowrap">K1 CUTOFF</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 16px; font-weight: 600; white-space: nowrap">64%</span>
</div>
</div>
<div style="display: flex; align-items: center; gap: 6px; padding: 0 8px; background: #11151C; min-width: 0">
<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="flex: none"><circle cx="12" cy="12" r="9" fill="none" stroke="#2A3242" stroke-width="3"></circle><circle cx="12" cy="12" r="9" fill="none" stroke="#FFB454" stroke-width="3" stroke-linecap="round" stroke-dasharray="21.5 56.6" transform="rotate(-90 12 12)"></circle></svg>
<div style="display: flex; flex-direction: column; line-height: 1.1; min-width: 0">
<span style="font-size: 16px; color: #9AA3B2; white-space: nowrap">K2 RESO</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 16px; font-weight: 600; white-space: nowrap">38%</span>
</div>
</div>
<div style="display: flex; align-items: center; gap: 6px; padding: 0 8px; background: #11151C; min-width: 0">
<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="flex: none"><circle cx="12" cy="12" r="9" fill="none" stroke="#2A3242" stroke-width="3"></circle><circle cx="12" cy="12" r="9" fill="none" stroke="#FFB454" stroke-width="3" stroke-linecap="round" stroke-dasharray="40.2 56.6" transform="rotate(-90 12 12)"></circle></svg>
<div style="display: flex; flex-direction: column; line-height: 1.1; min-width: 0">
<span style="font-size: 16px; color: #9AA3B2; white-space: nowrap">K3 ENV AMT</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 16px; font-weight: 600; white-space: nowrap">+42</span>
</div>
</div>
<div style="display: flex; align-items: center; gap: 6px; padding: 0 8px; background: #11151C; min-width: 0">
<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="flex: none"><circle cx="12" cy="12" r="9" fill="none" stroke="#2A3242" stroke-width="3"></circle><circle cx="12" cy="12" r="9" fill="none" stroke="#FFB454" stroke-width="3" stroke-linecap="round" stroke-dasharray="28.3 56.6" transform="rotate(-90 12 12)"></circle></svg>
<div style="display: flex; flex-direction: column; line-height: 1.1; min-width: 0">
<span style="font-size: 16px; color: #9AA3B2; white-space: nowrap">K4 KEYTRK</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 16px; font-weight: 600; white-space: nowrap">50%</span>
</div>
</div>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"ground":{"editor":"color","default":"#0B0D11"},"$preview":{"width":480,"height":480}}'>
class Component extends DCLogic {
renderVals() {
return { ground: this.props.ground ?? '#0B0D11' };
}
}
</script>
</body>
</html>
