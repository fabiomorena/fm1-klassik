<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Edit VA FLT – the filter curve</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&amp;family=IBM+Plex+Sans+Condensed:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#9AA3B2}a:hover{color:#E8EAED}
</style>
</helmet>
<!-- v0.8 (proposed 29.10.2026, from mockup 02 Edit-VA): VA's tab FLT keeps its four knobs (K1 CUT, K2 RES, K3 DRV, K4 KTR) and shows the filter's response instead of the big glyph: the cutoff dashed, the resonance as the peak, moving as the knobs turn (and with the LFO's FILTER). Below: the envelope small with ENV > FILTER, DRV and KTR, the live glyph. OSC (and PD's, ORGAN's pages) keep the big glyph. Here part 1 VA SAW LEAD, CUT turned down (the mark: the sound's value). -->
<div style="width: 480px; height: 480px; box-sizing: border-box; display: flex; flex-direction: column; background: #0B0D11; color: #E8EAED; font-family: 'IBM Plex Sans Condensed', 'Arial Narrow', sans-serif; overflow: hidden">
<header style="height: 40px; flex: none; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; background: #11151C; border-bottom: 1px solid #2A3242">
<div style="display: flex; align-items: center; gap: 8px; min-width: 0">
<span style="background: #FFB454; color: #0B0D11; font-weight: 700; font-size: 16px; padding: 2px 8px; border-radius: 6px; letter-spacing: 0.04em; flex: none">1 VA</span>
<svg width="22" height="22" viewBox="0 0 100 100" role="img" aria-label="Glyph of SAW LEAD*" style="flex: none"><circle cx="50" cy="50" r="46" fill="none" stroke="#2A3242" stroke-width="3"></circle><polygon points="50.0,38.5 60.2,39.8 78.8,50.0 58.1,58.1 50.0,86.0 36.1,63.9 35.8,50.0 29.6,29.6" fill="#FFB454" fill-opacity="0.375" stroke="#FFB454" stroke-width="5" stroke-linejoin="round"></polygon><circle cx="50" cy="50" r="5" fill="#FFB454"></circle></svg>
<span style="font-size: 17px; font-weight: 700; white-space: nowrap; letter-spacing: 0.04em">SAW LEAD*</span>
</div>
<div style="display: flex; align-items: center; gap: 8px; flex: none">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 15px; color: #9AA3B2">OCT +0</span>
<svg width="28" height="14" viewBox="0 0 30 16" role="img" aria-label="Battery about three quarters full"><rect x="1" y="1" width="25" height="14" rx="3" fill="none" stroke="#9AA3B2" stroke-width="2"></rect><rect x="27" y="5" width="2" height="6" rx="1" fill="#9AA3B2"></rect><rect x="4" y="4" width="15" height="8" rx="1.5" fill="#E8EAED"></rect></svg>
</div>
</header>
<main style="flex: 1; min-height: 0">
<svg width="480" height="386" viewBox="0 0 480 386" role="img" aria-label="Edit VA FLT – the filter curve" style="display: block; font-family: 'IBM Plex Sans Condensed', 'Arial Narrow', sans-serif">
<text x="10" y="22" font-size="17" font-weight="700" letter-spacing="1" fill="#9AA3B2">OSC</text>
<text x="66" y="22" font-size="17" font-weight="700" letter-spacing="1" fill="#E8EAED">FLT</text>
<rect x="66" y="28" width="34" height="3" fill="#FFB454"/>
<text x="122" y="22" font-size="17" font-weight="700" letter-spacing="1" fill="#9AA3B2">ENV</text>
<text x="178" y="22" font-size="17" font-weight="700" letter-spacing="1" fill="#9AA3B2">MORE</text>
<text x="470" y="22" text-anchor="end" font-family="IBM Plex Mono, monospace" font-size="16" fill="#9AA3B2">2/4</text>
<rect x="0" y="36" width="480" height="2" fill="#2A3242"/>
<rect x="2" y="44" width="476" height="196" rx="8" fill="#151922"/>
<text x="16" y="72" font-size="17" font-weight="700" letter-spacing="1" fill="#E8EAED">LOW PASS</text>
<text x="464" y="72" text-anchor="end" font-family="IBM Plex Mono, monospace" font-size="16" fill="#FFB454">CUT 50% · RES 24%</text>
<path d="M16 120 H464 M16 160 H464 M16 200 H464 M128 84 V214 M240 84 V214 M352 84 V214" stroke="#2A3242" stroke-width="1"/>
<path d="M16 130 L196 130 C214 130 222 108 232 108 C242 108 250 134 262 160 C290 200 330 210 464 214 L464 214 L16 214 Z" fill="#FFB454" fill-opacity="0.14"/>
<path d="M16 130 L196 130 C214 130 222 108 232 108 C242 108 250 134 262 160 C290 200 330 210 464 214" fill="none" stroke="#FFB454" stroke-width="3" stroke-linejoin="round"/>
<path d="M232 84 V214" stroke="#E8EAED" stroke-width="1.5" stroke-dasharray="4 5"/>
<text x="16" y="234" text-anchor="start" font-family="IBM Plex Mono, monospace" font-size="15" fill="#9AA3B2">20</text>
<text x="128" y="234" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="15" fill="#9AA3B2">200</text>
<text x="240" y="234" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="15" fill="#9AA3B2">2k</text>
<text x="464" y="234" text-anchor="end" font-family="IBM Plex Mono, monospace" font-size="15" fill="#9AA3B2">20k Hz</text>
<rect x="2" y="248" width="476" height="130" rx="8" fill="#151922"/>
<text x="16" y="276" font-size="17" font-weight="700" letter-spacing="1" fill="#E8EAED">ENV &gt; FILTER +20</text>
<path d="M18.0 360.0 L26.0 292.0 C38.5 304.9 48.5 306.3 76.0 306.3 L166.0 306.3 C180.0 354.0 197.5 360.0 236.0 360.0 L18.0 360.0 Z" fill="#FFB454" fill-opacity="0.14"/>
<path d="M18.0 360.0 L26.0 292.0 C38.5 304.9 48.5 306.3 76.0 306.3 L166.0 306.3 C180.0 354.0 197.5 360.0 236.0 360.0" fill="none" stroke="#FFB454" stroke-width="2" stroke-linejoin="round"/>
<text x="250" y="300" font-family="IBM Plex Mono, monospace" font-size="16" fill="#E8EAED">DRV 8%</text>
<text x="250" y="326" font-family="IBM Plex Mono, monospace" font-size="16" fill="#E8EAED">KTR 50%</text>
<g transform="translate(386 262)"><svg width="72" height="72" viewBox="0 0 100 100" role="img" aria-label="Live glyph of Saw Lead" style="flex: none"><circle cx="50" cy="50" r="46" fill="none" stroke="#2A3242" stroke-width="3"></circle><polygon points="50.0,38.5 60.2,39.8 78.8,50.0 58.1,58.1 50.0,86.0 36.1,63.9 35.8,50.0 29.6,29.6" fill="#FFB454" fill-opacity="0.375" stroke="#FFB454" stroke-width="5" stroke-linejoin="round"></polygon><circle cx="50" cy="50" r="5" fill="#FFB454"></circle></svg></g>
<text x="422" y="356" text-anchor="middle" font-size="15" fill="#9AA3B2">LIVE</text>
</svg>
</main>
<footer style="height: 52px; flex: none; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: #2A3242; border-top: 1px solid #2A3242">
<div style="display: flex; flex-direction: column; justify-content: center; gap: 3px; padding: 0 8px; background: #11151C; min-width: 0">
<span style="font-size: 16px; color: #9AA3B2; white-space: nowrap">K1 CUT</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 16px; font-weight: 600; white-space: nowrap">50%</span>
<span style="height: 3px; background: #2A3242; position: relative"><span style="position: absolute; left: 0; top: 0; bottom: 0; width: 50%; background: #FFB454"></span><span style="position: absolute; left: calc(71% - 2px); top: -4px; width: 4px; height: 11px; background: #E8EAED; border-radius: 1px"></span></span>
</div>
<div style="display: flex; flex-direction: column; justify-content: center; gap: 3px; padding: 0 8px; background: #11151C; min-width: 0">
<span style="font-size: 16px; color: #9AA3B2; white-space: nowrap">K2 RES</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 16px; font-weight: 600; white-space: nowrap">24%</span>
<span style="height: 3px; background: #2A3242; position: relative"><span style="position: absolute; left: 0; top: 0; bottom: 0; width: 24%; background: #FFB454"></span></span>
</div>
<div style="display: flex; flex-direction: column; justify-content: center; gap: 3px; padding: 0 8px; background: #11151C; min-width: 0">
<span style="font-size: 16px; color: #9AA3B2; white-space: nowrap">K3 DRV</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 16px; font-weight: 600; white-space: nowrap">8%</span>
<span style="height: 3px; background: #2A3242; position: relative"><span style="position: absolute; left: 0; top: 0; bottom: 0; width: 8%; background: #FFB454"></span></span>
</div>
<div style="display: flex; flex-direction: column; justify-content: center; gap: 3px; padding: 0 8px; background: #11151C; min-width: 0">
<span style="font-size: 16px; color: #9AA3B2; white-space: nowrap">K4 KTR</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 16px; font-weight: 600; white-space: nowrap">50%</span>
<span style="height: 3px; background: #2A3242; position: relative"><span style="position: absolute; left: 0; top: 0; bottom: 0; width: 50%; background: #FFB454"></span></span>
</div>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"ground":{"editor":"color","default":"#0B0D11"},"$preview":{"width":480,"height":480}}'>
class Component extends DCLogic {
renderVals() {
return { ground: this.props.ground ?? '#0B0D11' };
}
}
</script>
</body>
</html>
