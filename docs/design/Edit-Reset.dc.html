<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reset – a knob back to its sound's value</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&amp;family=IBM+Plex+Sans+Condensed:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#9AA3B2}a:hover{color:#E8EAED}
</style>
</helmet>
<div style="width: 480px; height: 480px; box-sizing: border-box; display: flex; flex-direction: column; background: #0B0D11; color: #E8EAED; font-family: 'IBM Plex Sans Condensed', 'Arial Narrow', sans-serif; overflow: hidden">
<header style="height: 40px; flex: none; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; background: #11151C; border-bottom: 1px solid #2A3242">
<!-- HOME pressed on an edit page: this message for 1.3 s, then the usual header (the sound's name with * while a
     value differs from its sound's) -->
<div style="display: flex; align-items: center; gap: 12px; min-width: 0">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 16px; font-weight: 600; white-space: nowrap">RESET</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 16px; font-weight: 600; white-space: nowrap; color: #E3F45E">TURN K1-K4</span>
</div>
<div style="display: flex; align-items: center; gap: 8px; flex: none">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 16px; font-weight: 600; color: #9AA3B2">OCT -1</span>
<svg width="28" height="14" viewBox="0 0 30 16" role="img" aria-label="Battery about three quarters full"><rect x="1" y="1" width="25" height="14" rx="3" fill="none" stroke="#9AA3B2" stroke-width="2"></rect><rect x="27" y="5" width="2" height="6" rx="1" fill="#9AA3B2"></rect><rect x="4" y="4" width="15" height="8" rx="1.5" fill="#E8EAED"></rect></svg>
</div>
</header>
<nav style="height: 32px; flex: none; box-sizing: border-box; padding: 0 16px; display: flex; align-items: stretch; gap: 14px; border-bottom: 1px solid #2A3242; font-size: 16px; letter-spacing: 0.06em">
<span style="display: flex; align-items: center; color: #E3F45E; font-weight: 700; border-bottom: 3px solid #E3F45E">FILTER</span>
<span style="display: flex; align-items: center; color: #9AA3B2">VOICE</span>
<span style="margin-left: auto; display: flex; align-items: center; font-family: 'IBM Plex Mono', monospace; color: #9AA3B2">1/2</span>
</nav>
<main style="flex: 1; min-height: 0; position: relative">
<svg width="480" height="356" viewBox="0 0 480 356" role="img" aria-label="Live glyph of Squelch with cutoff and resonance turned up" style="display: block">
<text x="16" y="26" fill="#9AA3B2" font-size="18" font-family="'IBM Plex Sans Condensed', 'Arial Narrow', sans-serif">LIVE</text>
<circle cx="240" cy="176" r="112" fill="none" stroke="#2A3242" stroke-width="3"></circle>
<path d="M240 176 L240 72 M240 176 L313.5 102.5 M240 176 L344 176 M240 176 L313.5 249.5 M240 176 L240 280 M240 176 L166.5 249.5 M240 176 L136 176 M240 176 L166.5 102.5" stroke="#2A3242" stroke-width="1.5" fill="none"></path>
<polygon points="240.0,111.0 298.5,117.5 336.9,176.0 291.8,227.8 240.0,233.5 188.2,227.8 214.0,176.0 210.5,146.5" fill="#E3F45E" fill-opacity="0.375" stroke="#E3F45E" stroke-width="4" stroke-linejoin="round"></polygon>
<rect x="237" y="173" width="6" height="6" fill="#E3F45E"></rect>
<g font-size="20" font-family="'IBM Plex Sans Condensed', 'Arial Narrow', sans-serif" text-anchor="middle" dominant-baseline="middle">
<text x="240" y="40" fill="#E3F45E">TUNE</text>
<text x="344" y="78" fill="#E3F45E">CUTOFF</text>
<text x="400" y="176" fill="#E3F45E">RESO</text>
<text x="350" y="276" fill="#E3F45E">ENV MOD</text>
<text x="240" y="316" fill="#9AA3B2">DECAY</text>
<text x="130" y="276" fill="#9AA3B2">ACCENT</text>
<text x="82" y="176" fill="#9AA3B2">WAVE</text>
<text x="136" y="78" fill="#9AA3B2">SLIDE</text>
</g>
</svg>
</main>
<!-- a mark (text colour) on a knob's bar: its sound's value, while the knob is elsewhere -->
<footer style="height: 52px; flex: none; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: #2A3242; border-top: 1px solid #2A3242">
<div style="display: flex; flex-direction: column; justify-content: center; gap: 3px; padding: 0 8px; background: #11151C; min-width: 0">
<span style="font-size: 16px; color: #9AA3B2; white-space: nowrap">K1 TUNE</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 16px; font-weight: 600; white-space: nowrap">+0</span>
<span style="height: 3px; background: #2A3242; position: relative"><span style="position: absolute; left: 0; top: 0; bottom: 0; width: 50%; background: #E3F45E"></span></span>
</div>
<div style="display: flex; flex-direction: column; justify-content: center; gap: 3px; padding: 0 8px; background: #11151C; min-width: 0">
<span style="font-size: 16px; color: #9AA3B2; white-space: nowrap">K2 CUTOFF</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 16px; font-weight: 600; white-space: nowrap">72</span>
<span style="height: 3px; background: #2A3242; position: relative"><span style="position: absolute; left: 0; top: 0; bottom: 0; width: 73%; background: #E3F45E"></span><span style="position: absolute; left: calc(35% - 2px); top: -4px; width: 4px; height: 11px; background: #E8EAED"></span></span>
</div>
<div style="display: flex; flex-direction: column; justify-content: center; gap: 3px; padding: 0 8px; background: #11151C; min-width: 0">
<span style="font-size: 16px; color: #9AA3B2; white-space: nowrap">K3 RESO</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 16px; font-weight: 600; white-space: nowrap">90</span>
<span style="height: 3px; background: #2A3242; position: relative"><span style="position: absolute; left: 0; top: 0; bottom: 0; width: 91%; background: #E3F45E"></span><span style="position: absolute; left: calc(76% - 2px); top: -4px; width: 4px; height: 11px; background: #E8EAED"></span></span>
</div>
<div style="display: flex; flex-direction: column; justify-content: center; gap: 3px; padding: 0 8px; background: #11151C; min-width: 0">
<span style="font-size: 16px; color: #9AA3B2; white-space: nowrap">K4 ENV MOD</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 16px; font-weight: 600; white-space: nowrap">60</span>
<span style="height: 3px; background: #2A3242; position: relative"><span style="position: absolute; left: 0; top: 0; bottom: 0; width: 61%; background: #E3F45E"></span></span>
</div>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"ground":{"editor":"color","default":"#0B0D11"},"$preview":{"width":480,"height":480}}'>
class Component extends DCLogic {
renderVals() {
return { ground: this.props.ground ?? '#0B0D11' };
}
}
</script>
</body>
</html>
