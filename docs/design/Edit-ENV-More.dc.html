<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Edit ENV MORE – envelope to filter, voice</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&amp;family=IBM+Plex+Sans+Condensed:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#9AA3B2}a:hover{color:#E8EAED}
</style>
</helmet>
<!-- v0.8 (proposed 29.10.2026, Fabio: ENV > FILTER adjustable): after ENV a tab MORE (ENV again, or EDIT / OCT+): K1 ENV > FILTER -64..63 (VA: to the cutoff; PD: ENV > DCW; ORGAN: none, -), K2 VOICE POLY / MONO (the preset's MONO: one voice, legato), K3/K4 free; both the sound's (USER sound, HOME to the sound's). VA, PD and ORGAN; FM6 keeps ALGO, ENV. The picture: the cutoff over a note, CUT dashed plus the envelope's share (negative: below). Here part 1 VA SAW LEAD (+20, MONO). -->
<div style="width: 480px; height: 480px; box-sizing: border-box; display: flex; flex-direction: column; background: #0B0D11; color: #E8EAED; font-family: 'IBM Plex Sans Condensed', 'Arial Narrow', sans-serif; overflow: hidden">
<header style="height: 40px; flex: none; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; background: #11151C; border-bottom: 1px solid #2A3242">
<div style="display: flex; align-items: center; gap: 8px; min-width: 0">
<span style="background: #FFB454; color: #0B0D11; font-weight: 700; font-size: 16px; padding: 2px 8px; border-radius: 6px; letter-spacing: 0.04em; flex: none">1 VA</span>
<svg width="22" height="22" viewBox="0 0 100 100" role="img" aria-label="Glyph of SAW LEAD" style="flex: none"><circle cx="50" cy="50" r="46" fill="none" stroke="#2A3242" stroke-width="3"></circle><polygon points="50.0,38.5 60.2,39.8 78.8,50.0 58.1,58.1 50.0,86.0 36.1,63.9 35.8,50.0 29.6,29.6" fill="#FFB454" fill-opacity="0.375" stroke="#FFB454" stroke-width="5" stroke-linejoin="round"></polygon><circle cx="50" cy="50" r="5" fill="#FFB454"></circle></svg>
<span style="font-size: 17px; font-weight: 700; white-space: nowrap; letter-spacing: 0.04em">SAW LEAD</span>
</div>
<div style="display: flex; align-items: center; gap: 8px; flex: none">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 15px; color: #9AA3B2">OCT +0</span>
<svg width="28" height="14" viewBox="0 0 30 16" role="img" aria-label="Battery about three quarters full"><rect x="1" y="1" width="25" height="14" rx="3" fill="none" stroke="#9AA3B2" stroke-width="2"></rect><rect x="27" y="5" width="2" height="6" rx="1" fill="#9AA3B2"></rect><rect x="4" y="4" width="15" height="8" rx="1.5" fill="#E8EAED"></rect></svg>
</div>
</header>
<main style="flex: 1; min-height: 0">
<svg width="480" height="386" viewBox="0 0 480 386" role="img" aria-label="Edit ENV MORE – envelope to filter, voice" style="display: block; font-family: 'IBM Plex Sans Condensed', 'Arial Narrow', sans-serif">
<text x="10" y="22" font-size="17" font-weight="700" letter-spacing="1" fill="#9AA3B2">OSC</text>
<text x="66" y="22" font-size="17" font-weight="700" letter-spacing="1" fill="#9AA3B2">FLT</text>
<text x="122" y="22" font-size="17" font-weight="700" letter-spacing="1" fill="#9AA3B2">ENV</text>
<text x="178" y="22" font-size="17" font-weight="700" letter-spacing="1" fill="#E8EAED">MORE</text>
<rect x="178" y="28" width="44" height="3" fill="#FFB454"/>
<text x="470" y="22" text-anchor="end" font-family="IBM Plex Mono, monospace" font-size="16" fill="#9AA3B2">4/4</text>
<rect x="0" y="36" width="480" height="2" fill="#2A3242"/>
<rect x="2" y="44" width="476" height="196" rx="8" fill="#151922"/>
<text x="16" y="72" font-size="17" font-weight="700" letter-spacing="1" fill="#E8EAED">ENV &gt; FILTER</text>
<text x="464" y="72" text-anchor="end" font-family="IBM Plex Mono, monospace" font-size="16" fill="#FFB454">+20</text>
<path d="M24 214 H456" stroke="#2A3242" stroke-width="1"/>
<path d="M24 176 H456" stroke="#E8EAED" stroke-width="1.5" stroke-dasharray="4 5"/>
<text x="456" y="168" text-anchor="end" font-family="IBM Plex Mono, monospace" font-size="15" fill="#9AA3B2">CUT 50%</text>

<path d="M28.0 176.0 L42.0 100.0 C66.0 114.4 85.2 116.0 138.0 116.0 L308.0 116.0 C338.0 170.0 375.5 176.0 458.0 176.0" fill="none" stroke="#FFB454" stroke-width="3" stroke-linejoin="round"/>

<rect x="2" y="248" width="476" height="130" rx="8" fill="#151922"/>
<text x="16" y="276" font-size="17" font-weight="700" letter-spacing="1" fill="#E8EAED">VOICE</text>
<rect x="16" y="290" width="76" height="28" rx="6" fill="none" stroke="#2A3242" stroke-width="2"/>
<text x="54" y="310" text-anchor="middle" font-size="16" font-weight="700" fill="#9AA3B2">POLY</text>
<rect x="100" y="290" width="76" height="28" rx="6" fill="#FFB454"/>
<text x="138" y="310" text-anchor="middle" font-size="16" font-weight="700" fill="#0B0D11">MONO</text>
<text x="16" y="346" font-size="15" fill="#9AA3B2">ONE VOICE, LEGATO</text>
<g transform="translate(386 262)"><svg width="72" height="72" viewBox="0 0 100 100" role="img" aria-label="Live glyph of Saw Lead" style="flex: none"><circle cx="50" cy="50" r="46" fill="none" stroke="#2A3242" stroke-width="3"></circle><polygon points="50.0,38.5 60.2,39.8 78.8,50.0 58.1,58.1 50.0,86.0 36.1,63.9 35.8,50.0 29.6,29.6" fill="#FFB454" fill-opacity="0.375" stroke="#FFB454" stroke-width="5" stroke-linejoin="round"></polygon><circle cx="50" cy="50" r="5" fill="#FFB454"></circle></svg></g>
<text x="422" y="356" text-anchor="middle" font-size="15" fill="#9AA3B2">LIVE</text>
</svg>
</main>
<footer style="height: 52px; flex: none; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: #2A3242; border-top: 1px solid #2A3242">
<div style="display: flex; flex-direction: column; justify-content: center; gap: 3px; padding: 0 8px; background: #11151C; min-width: 0">
<span style="font-size: 16px; color: #9AA3B2; white-space: nowrap">K1 ENV&gt;FLT</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 16px; font-weight: 600; white-space: nowrap">+20</span>
<span style="height: 3px; background: #2A3242; position: relative"><span style="position: absolute; left: 0; top: 0; bottom: 0; width: 66%; background: #FFB454"></span></span>
</div>
<div style="display: flex; flex-direction: column; justify-content: center; gap: 3px; padding: 0 8px; background: #11151C; min-width: 0">
<span style="font-size: 16px; color: #9AA3B2; white-space: nowrap">K2 VOICE</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 16px; font-weight: 600; white-space: nowrap">MONO</span>
<span style="height: 3px; background: #2A3242; position: relative"><span style="position: absolute; left: 0; top: 0; bottom: 0; width: 100%; background: #FFB454"></span></span>
</div>
<div style="display: flex; flex-direction: column; justify-content: center; gap: 3px; padding: 0 8px; background: #11151C; min-width: 0">
<span style="font-size: 16px; color: #9AA3B2; white-space: nowrap">K3</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 16px; font-weight: 600; white-space: nowrap">-</span>
<span style="height: 3px; background: #2A3242; position: relative"><span style="position: absolute; left: 0; top: 0; bottom: 0; width: 0%; background: #FFB454"></span></span>
</div>
<div style="display: flex; flex-direction: column; justify-content: center; gap: 3px; padding: 0 8px; background: #11151C; min-width: 0">
<span style="font-size: 16px; color: #9AA3B2; white-space: nowrap">K4</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 16px; font-weight: 600; white-space: nowrap">-</span>
<span style="height: 3px; background: #2A3242; position: relative"><span style="position: absolute; left: 0; top: 0; bottom: 0; width: 0%; background: #FFB454"></span></span>
</div>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"ground":{"editor":"color","default":"#0B0D11"},"$preview":{"width":480,"height":480}}'>

renderVals() {
return { ground: this.props.ground ?? '#0B0D11' };
}
}
</script>
</body>
</html>
