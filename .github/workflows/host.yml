# Every push: the host simulator built and every one of KLASSIK's tests run; the screenshots kept as an artifact.
name: host
on: [push, pull_request]
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: pip install pillow
      - run: python3 base/tools/build.py firmware/klassik --host
      - run: |
          for t in firmware/klassik/tests/*.txt; do
            echo "== $t"
            firmware/klassik/build/host/klassik_host "$t" firmware/klassik/build/host || exit 1
          done
      - uses: actions/upload-artifact@v4
        with:
          name: screens
          path: |
            firmware/klassik/build/host/*.png
            firmware/klassik/build/host/*.wav
